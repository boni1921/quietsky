<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quietsky</title>
    <style>
      body {
        margin: 0;
        padding: 12px 14px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        min-width: 240px;
        color: #222;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 650;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }
      .toggle-row span {
        line-height: 1.3;
      }
      .toggle-row small {
        display: block;
        font-weight: 400;
        color: #666;
        font-size: 11px;
        margin-top: 2px;
      }
      .toggle-row input {
        width: 1.15rem;
        height: 1.15rem;
        margin: 0;
        accent-color: #1083fe;
        cursor: pointer;
        flex-shrink: 0;
      }
      .divider {
        height: 1px;
        background: #e5e5e5;
        margin: 4px 0 12px;
      }
      #mute-status {
        margin: 4px 0 0;
        font-size: 12px;
        color: #227a3a;
        min-height: 1em;
      }
      #mute-status.error {
        color: #a33;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 0 0 10px;
      }
      .section-head h1 {
        margin: 0;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 2px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: #666;
        cursor: pointer;
        flex-shrink: 0;
      }
      .icon-btn:hover {
        color: #1083fe;
      }
      .icon-btn svg {
        width: 16px;
        height: 16px;
        display: block;
      }
      .mute-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .mute-actions {
        display: flex;
        gap: 6px;
      }
      .mute-actions[hidden] {
        display: none;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 4px 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #expired-list {
        display: none;
        margin: 0 0 8px;
        padding: 0;
        list-style: none;
        max-height: 160px;
        overflow: auto;
      }
      #expired-list.open {
        display: block;
      }
      #expired-list li {
        padding: 4px 0;
        border-bottom: 1px solid #eee;
        line-height: 1.3;
      }
      #expired-list small {
        display: block;
        color: #666;
        font-size: 11px;
      }
      .whitelist-section {
        margin: 2px 0 0;
      }
      .whitelist-section label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .whitelist-section small {
        display: block;
        font-weight: 400;
        color: #666;
        font-size: 11px;
        margin-top: 2px;
      }
      #commentWhitelist {
        box-sizing: border-box;
        width: 100%;
        min-height: 64px;
        margin-top: 6px;
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font: inherit;
        font-size: 12px;
        line-height: 1.4;
        color: #222;
        resize: vertical;
      }
      #commentWhitelist:focus {
        outline: none;
        border-color: #1083fe;
      }
    </style>
  </head>
  <body>
    <h1>Hide engagement counts</h1>
    <label class="toggle-row">
      <span>
        Likes
        <small>Feed + post detail</small>
      </span>
      <input type="checkbox" id="hideLikes" checked />
    </label>
    <label class="toggle-row">
      <span>
        Reposts
        <small>Includes quote counts</small>
      </span>
      <input type="checkbox" id="hideReposts" checked />
    </label>
    <label class="toggle-row">
      <span>
        Bookmarks
        <small>Save counts on posts</small>
      </span>
      <input type="checkbox" id="hideBookmarks" checked />
    </label>
    <label class="toggle-row">
      <span>
        Comments
        <small>Reply counts, buttons stay usable</small>
      </span>
      <input type="checkbox" id="hideComments" checked />
    </label>
    <div class="divider"></div>
    <label class="toggle-row">
      <span>
        Show mine only
        <small>Keep counts on your posts</small>
      </span>
      <input type="checkbox" id="showOwnOnly" />
    </label>
    <div class="divider"></div>
    <div class="whitelist-section">
      <label for="commentWhitelist">
        Comment count whitelist
        <small>One handle per line (e.g. alice.bsky.social). DIDs also work. Whitelisted users keep their reply counts.</small>
      </label>
      <textarea
        id="commentWhitelist"
        rows="3"
        spellcheck="false"
        placeholder="alice.bsky.social&#10;did:plc:..."
      ></textarea>
    </div>
    <div class="divider"></div>
    <h1>UI improvement</h1>
    <label class="toggle-row">
      <span>
        Quick reactions
        <small>Show more and Show less on For You</small>
      </span>
      <input type="checkbox" id="quickReactions" />
    </label>
    <div class="divider"></div>
    <div class="section-head">
      <h1>Muted words</h1>
      <button
        type="button"
        class="icon-btn"
        id="open-moderation"
        title="Open Bluesky mute settings"
        aria-label="Open Bluesky mute settings"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M15 3h6v6" />
          <path d="M10 14 21 3" />
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
        </svg>
      </button>
    </div>
    <label class="toggle-row">
      <span>
        Auto-renew expired
        <small>Clear expiry dates automatically</small>
      </span>
      <input type="checkbox" id="autoRenewMutes" checked />
    </label>
    <div class="mute-head">
      <span id="expired-count">— expired</span>
      <div class="mute-actions" id="mute-actions" hidden>
        <button type="button" id="view-expired">View</button>
        <button type="button" id="renew-all">Renew all</button>
      </div>
    </div>
    <ul id="expired-list"></ul>
    <p id="mute-status" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
